apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: hpa-demo
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        uid: victoriametrics
        access: proxy
        url: http://victoriametrics.hpa-demo.svc.cluster.local:8428
        isDefault: true
        editable: true
        jsonData:
          timeInterval: "2s"
          httpMethod: POST
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'hpa-demo-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: hpa-demo
data:
  hpa-cpu-vs-eld.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "tags": ["hpa-demo", "server", "hpa"],
      "links": [
        {
          "title": "Dashboards",
          "type": "dashboards",
          "tags": ["hpa-demo"],
          "asDropdown": false,
          "keepTime": true,
          "includeVars": true,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "type": "text",
          "title": "Server & HPA View (prom-client Metrics)",
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
          "options": {
            "mode": "markdown",
            "content": "**Use the `Deployment` picker above** (`All`, `app-cpu`, `app-eld`) to filter or compare side-by-side. Pods export standard **`prom-client`** metrics (`nodejs_eventloop_lag_p99_seconds`, `process_cpu_seconds_total`, `http_request_duration_seconds_bucket`). Under micro-burst traffic from **k6**, `app-cpu` stays around **~48% CPU** (below its **65% CPU HPA threshold**) and never scales, suffering severe event loop lag and tail latency. `app-eld` scales out immediately on `nodejs_eventloop_lag_p99_seconds` (>20ms) and keeps tail latency low."
          }
        },
        {
          "type": "timeseries",
          "title": "1. Active Replicas (HPA Scale-out)",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 3 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 6,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "lineWidth": 3,
                "fillOpacity": 15,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(nodejs_eventloop_lag_p99_seconds{deployment=~\"$deployment\"}) by (deployment)",
              "legendFormat": "{{deployment}} replicas"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "2. Server HTTP Tail Latency — p99, p95, p50 (prom-client Histogram)",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 3 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{deployment=~\"$deployment\"}[20s])) by (le, deployment))",
              "legendFormat": "{{deployment}} p99"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{deployment=~\"$deployment\"}[20s])) by (le, deployment))",
              "legendFormat": "{{deployment}} p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{deployment=~\"$deployment\"}[20s])) by (le, deployment))",
              "legendFormat": "{{deployment}} p50"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "3. Server Throughput (Requests / sec)",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 3 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{deployment=~\"$deployment\"}[15s])) by (deployment)",
              "legendFormat": "{{deployment}} req/s (total)"
            },
            {
              "refId": "B",
              "expr": "avg(rate(http_requests_total{deployment=~\"$deployment\"}[15s])) by (deployment)",
              "legendFormat": "{{deployment}} req/s (per pod)"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "4. Node.js Event Loop Lag — p99, p90 & Mean (ELD HPA Threshold = 20ms)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 20 }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "thresholdsStyle": { "mode": "dashed" }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg((nodejs_eventloop_lag_p99_seconds{deployment=~\"$deployment\"} - nodejs_eventloop_lag_min_seconds{deployment=~\"$deployment\"}) * 1000) by (deployment)",
              "legendFormat": "{{deployment}} ELD p99"
            },
            {
              "refId": "B",
              "expr": "avg((nodejs_eventloop_lag_p90_seconds{deployment=~\"$deployment\"} - nodejs_eventloop_lag_min_seconds{deployment=~\"$deployment\"}) * 1000) by (deployment)",
              "legendFormat": "{{deployment}} ELD p90"
            },
            {
              "refId": "C",
              "expr": "avg((nodejs_eventloop_lag_mean_seconds{deployment=~\"$deployment\"} - nodejs_eventloop_lag_min_seconds{deployment=~\"$deployment\"}) * 1000) by (deployment)",
              "legendFormat": "{{deployment}} ELD mean"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "5. Pod CPU Utilization % of 250m Request (CPU HPA Threshold = 65%)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 65 }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "thresholdsStyle": { "mode": "dashed" }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg(rate(process_cpu_seconds_total{deployment=~\"$deployment\"}[20s]) / 0.25 * 100) by (deployment)",
              "legendFormat": "{{deployment}} avg CPU % (20s rate)"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "6. Per-Pod Event Loop Lag p99 (ms)",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(nodejs_eventloop_lag_p99_seconds{deployment=~\"$deployment\"} - nodejs_eventloop_lag_min_seconds{deployment=~\"$deployment\"}) * 1000",
              "legendFormat": "{{deployment}} / {{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "7. Per-Pod CPU Utilization (%)",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(process_cpu_seconds_total{deployment=~\"$deployment\"}[20s]) / 0.25 * 100",
              "legendFormat": "{{deployment}} / {{pod}}"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "deployment",
            "label": "Deployment",
            "type": "custom",
            "query": "app-cpu,app-eld",
            "includeAll": true,
            "multi": true,
            "allValue": "app-cpu|app-eld",
            "current": {
              "selected": true,
              "text": ["All"],
              "value": ["$__all"]
            },
            "options": [
              { "selected": true, "text": "All", "value": "$__all" },
              { "selected": false, "text": "app-cpu", "value": "app-cpu" },
              { "selected": false, "text": "app-eld", "value": "app-eld" }
            ]
          }
        ]
      },
      "time": { "from": "now-10m", "to": "now" },
      "title": "1. Server & HPA: CPU Usage vs Event Loop Delay",
      "uid": "hpa-cpu-vs-eld",
      "version": 3
    }
