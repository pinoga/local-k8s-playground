          "title": "3. k6 Client Request Rate (RPS) by Deployment",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
