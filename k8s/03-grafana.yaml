          "options": {
            "mode": "markdown",
            "content": "**Client-side perspective exported directly by Grafana k6 (`--out experimental-prometheus-rw`)**. Use the **`Deployment` picker** above to inspect `app-cpu` or `app-eld`, or compare both across sequential runs. Running each deployment in an isolated Kubernetes `Job` prevents noisy-neighbor CPU contention on the host and tracks **p50, p90, p95, p99 tail latencies, TTFB (`http_req_waiting`), RPS, check pass rates, and active VUs**."
