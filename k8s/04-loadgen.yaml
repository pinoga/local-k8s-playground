# ============================================================================
# Isolated k6 Load Generator Jobs (Single-Target Execution)
# Both Jobs are created with `suspend: true` by default so applying the stack
# does not run both simultaneously and cause noisy-neighbor CPU contention.
# Unsuspend or trigger one Job at a time via `./scripts/load-profile.sh`.
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen-app-cpu
  namespace: hpa-demo
  labels:
    app: loadgen
    target-deployment: app-cpu
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: loadgen
        target-deployment: app-cpu
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args:
            - run
            - --out
            - experimental-prometheus-rw
            - --tag
            - deployment=app-cpu
            - /scripts/loadgen.js
          env:
            - name: TARGET_DEPLOYMENT
              value: "app-cpu"
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "http://victoriametrics.hpa-demo.svc.cluster.local:8428/api/v1/write"
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(50),p(90),p(95),p(99),avg,min,max"
            - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
              value: "2s"
            - name: DURATION
              value: "3m"
            - name: BURST_SIZE
              value: "5"
            - name: BURST_INTERVAL_MS
              value: "750"
            - name: IO_MS
              value: "45"
            - name: BLOCK_MS
              value: "18"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: loadgen-script
---
