apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: hpa-demo
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args:
            - run
            - --out
            - experimental-prometheus-rw
            - /scripts/loadgen.js
          env:
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "http://victoriametrics.hpa-demo.svc.cluster.local:8428/api/v1/write"
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(50),p(90),p(95),p(99),avg,min,max"
            - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
              value: "2s"
            - name: BURST_SIZE
              value: "5"
            - name: BURST_INTERVAL_MS
              value: "750"
            - name: IO_MS
              value: "45"
            - name: BLOCK_MS
              value: "18"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: loadgen-script
